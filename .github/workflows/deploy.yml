name: Deploy site

# 每次推 main 就构建并发布到 GitHub Pages。
#
# 为什么在 CI 里构建：本地 Windows 上 `vite build` 会在渲染 chunks 阶段原生崩溃
# （exit 0xC0000409），换 Vite 版本、重装依赖、改路径都试过无效；Linux runner 上没有这个问题。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送排队而不是取消正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit && vite build && node scripts/inline-build.mjs
      # 最后一步把 JS/CSS 内联进 index.html，产物是 dist/ 下的单文件页面 + public/ 里的静态页
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
