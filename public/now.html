  <script type="application/json" id="recent-data">[{"title":"词性标注与 HMM：三张表、两次动态规划","href":"note-pos-hmm.html","meta":"2026-11 · 推导 · 附短片"},{"title":"中文分词与 CRF：从查词典到整句打分","href":"note-seg-crf.html","meta":"2026-11 · 推导 · 附短片"},{"title":"BPE：模型眼里的词，是长出来的零件","href":"note-bpe.html","meta":"2026-11 · 推导 · 附短片"}]</script>
  <script>
    (() => {
      const statusLabels = { active: '进行中', paused: '暂停', archived: '归档' }

      const el = (tag, className, text) => {
        const node = document.createElement(tag)
        if (className) node.className = className
        if (text != null) node.textContent = text
        return node
      }

      const daysSince = (date) => {
        if (!date) return null
        const then = Date.parse(`${date}T00:00:00`)
        if (Number.isNaN(then)) return null
        return Math.max(0, Math.floor((Date.now() - then) / 86400000))
      }

      const shortDate = (date) => (date ? date.replaceAll('-', '.') : '未知')

      function renderLines(data) {
        const grid = document.getElementById('line-grid')
        grid.textContent = ''

        if (!data.lines?.length) {
          grid.append(el('p', 'now-empty', '这周还没有公开的活跃线。'))
          return
        }

        for (const line of data.lines) {
          const card = el('article', 'line-card')

          const head = el('div', 'line-head')
          const status = el('span', 'line-status')
          status.append(el('span', `line-dot ${line.status === 'active' ? 'active' : ''}`))
          status.append(el('span', '', statusLabels[line.status] ?? line.status))
          head.append(status)

          const days = daysSince(line.updated)
          head.append(
            el('span', '', line.status === 'active' && days != null ? `${days} 天前` : shortDate(line.updated)),
          )
          card.append(head)

          card.append(el('h3', '', line.title))
          card.append(el('p', '', line.summary))

          const meta = el('p', 'line-meta')
          meta.append(el('span', '', `最后推进 ${shortDate(line.updated)}`))
          if (line.status === 'active' && days != null && days >= 14) {
            meta.append(el('span', 'stale', ` · 停滞 ${days} 天`))
          }
          card.append(meta)

          grid.append(card)
        }
      }

      function noteDate(meta) {
        const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(meta ?? '')
        if (!m) return null
        return {
          key: Date.UTC(Number(m[1]), Number(m[2]) - 1, m[3] ? Number(m[3]) : 1),
          label: `${m[1]}.${m[2]}${m[3] ? `.${m[3]}` : ''}`,
        }
      }

      function renderRecent() {
        const list = document.getElementById('recent-list')
        const notes = readJSON('recent-data', [])

        list.textContent = ''
        if (!notes.length) {
          const item = document.createElement('li')
          item.append(el('span', 'now-error', '最近更新暂时读不到。'))
          list.append(item)
          return
        }

        for (const note of notes) {
          const item = document.createElement('li')
          const link = el('a', '', note.title)
          link.href = note.href
          const date = noteDate(note.meta)
          const time = el('time', '', date?.label ?? '')
          if (note.meta) time.dateTime = note.meta.slice(0, 10)
          item.append(link, time)
          list.append(item)
        }
      }

      function readJSON(id, fallback) {
        try {
          return JSON.parse(document.getElementById(id).textContent)
        } catch {
          return fallback
        }
      }

      function boot() {
        const data = readJSON('now-data', null)

        if (!data) {
          document.getElementById('now-focus').textContent = '活跃线数据缺失。'
          const grid = document.getElementById('line-grid')
          grid.textContent = ''
          grid.append(el('p', 'now-error', '请在笔记仓库运行 npm run sync:now 后重新构建。'))
          return
        }

        if (data.focus) document.getElementById('now-focus').textContent = data.focus
        if (data.generatedAt) {
          document.getElementById('now-kicker').textContent =
            `NOW · 更新于 ${data.generatedAt.replaceAll('-', '.')}`
        }
        renderLines(data)
        renderRecent()
      }

      boot()
    })()
  </script>
